<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 120" width="100%" height="100%">
  <defs>
    <!-- Metallic Chrome Ring Gradient for Dark Background -->
    <linearGradient id="chromeRingWhite" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#E2E8F0" />
      <stop offset="40%" stop-color="#94A3B8" />
      <stop offset="55%" stop-color="#F8FAFC" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="85%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Spear Upper Facet (Bright Specular) -->
    <linearGradient id="spearUpperWhite" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="45%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Spear Lower Facet -->
    <linearGradient id="spearLowerWhite" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Faceted Metallic "X" Gradients for Dark BG -->
    <linearGradient id="xFacetTopLeftWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="xFacetTopRightWhite" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="60%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <linearGradient id="xFacetBottomLeftWhite" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="70%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <linearGradient id="xFacetBottomRightWhite" x1="100%" y1="100%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="60%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <radialGradient id="xCenterGleamWhite" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Left Circular Emblem (cx=65, cy=60) -->
  <g id="nexe-emblem-white" transform="translate(65, 60)">
    <!-- Inner Blue Disc -->
    <circle cx="0" cy="0" r="37.5" fill="#0D3B66" />

    <!-- Outer Chrome Ring Base -->
    <circle cx="0" cy="0" r="43.5" fill="none" stroke="url(#chromeRingWhite)" stroke-width="8" />

    <!-- Ring Bevel Highlights -->
    <circle cx="0" cy="0" r="47.5" fill="none" stroke="#94A3B8" stroke-width="0.7" opacity="0.6" />
    <circle cx="0" cy="0" r="39.5" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.9" />

    <!-- 3D Faceted Diagonal Spear Piercing Through -->
    <polygon points="-58,58 -2,-2 58,-58 -1,-3" fill="url(#spearUpperWhite)" />
    <polygon points="-58,58 58,-58 2,2" fill="url(#spearLowerWhite)" />
    <line x1="-58" y1="58" x2="58" y2="-58" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Typography: White #FFFFFF for dark backgrounds -->
  <!-- Letter N -->
  <path d="M 136 63 L 136 24 L 148 24 L 163 47 L 163 24 L 173 24 L 173 63 L 161 63 L 146 40 L 146 63 Z" fill="#FFFFFF" />

  <!-- Letter E (First) -->
  <path d="M 183 24 L 213 24 L 213 32 L 193 32 L 193 39 L 209 39 L 209 47 L 193 47 L 193 55 L 213 55 L 213 63 L 183 63 Z" fill="#FFFFFF" />

  <!-- 3D Beveled Metallic Letter X -->
  <g id="metallic-X-white" transform="translate(220, 24)">
    <polygon points="0,0 12,0 19,19.5 7,19.5" fill="url(#xFacetTopLeftWhite)" />
    <polygon points="26,0 38,0 31,19.5 19,19.5" fill="url(#xFacetTopRightWhite)" />
    <polygon points="0,39 12,39 19,19.5 7,19.5" fill="url(#xFacetBottomLeftWhite)" />
    <polygon points="26,39 38,39 31,19.5 19,19.5" fill="url(#xFacetBottomRightWhite)" />

    <polygon points="6,0 19,19.5 32,0 19,10" fill="#FFFFFF" opacity="0.7" />
    <polygon points="6,39 19,19.5 32,39 19,29" fill="#475569" opacity="0.5" />
    <polygon points="0,0 19,19.5 0,39 10,19.5" fill="#E2E8F0" opacity="0.6" />
    <polygon points="38,0 19,19.5 38,39 28,19.5" fill="#94A3B8" opacity="0.6" />

    <line x1="0" y1="0" x2="38" y2="39" stroke="#FFFFFF" stroke-width="0.9" opacity="0.8" />
    <line x1="38" y1="0" x2="0" y2="39" stroke="#475569" stroke-width="0.7" opacity="0.7" />

    <circle cx="19" cy="19.5" r="10" fill="url(#xCenterGleamWhite)" />
  </g>

  <!-- Letter E (Second) -->
  <path d="M 268 24 L 298 24 L 298 32 L 278 32 L 278 39 L 294 39 L 294 47 L 278 47 L 278 55 L 298 55 L 298 63 L 268 63 Z" fill="#FFFFFF" />

  <!-- Subtitle: RIVNING in White -->
  <g font-family="'Space Grotesk', 'Arial Black', -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="3.2">
    <text x="136" y="97" fill="#FFFFFF">RIVNING</text>
  </g>
</svg>
