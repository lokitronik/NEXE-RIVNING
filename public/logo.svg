<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 120" width="100%" height="100%">
  <defs>
    <!-- Metallic Chrome Ring Gradient -->
    <linearGradient id="chromeRing" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="18%" stop-color="#D1D5DB" />
      <stop offset="38%" stop-color="#9CA3AF" />
      <stop offset="55%" stop-color="#F3F4F6" />
      <stop offset="70%" stop-color="#9CA3AF" />
      <stop offset="88%" stop-color="#6B7280" />
      <stop offset="100%" stop-color="#E5E7EB" />
    </linearGradient>

    <!-- Ring Inner Depth Gradient -->
    <linearGradient id="ringDepth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B5563" />
      <stop offset="50%" stop-color="#9CA3AF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Spear Upper Facet (Bright Specular) -->
    <linearGradient id="spearUpper" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9CA3AF" />
      <stop offset="45%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#F3F4F6" />
      <stop offset="100%" stop-color="#9CA3AF" />
    </linearGradient>

    <!-- Spear Lower Facet (Metallic Shaded) -->
    <linearGradient id="spearLower" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4B5563" />
      <stop offset="50%" stop-color="#9CA3AF" />
      <stop offset="100%" stop-color="#6B7280" />
    </linearGradient>

    <!-- Faceted Metallic "X" Gradients -->
    <linearGradient id="xFacetTopLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E5E7EB" />
      <stop offset="100%" stop-color="#9CA3AF" />
    </linearGradient>

    <linearGradient id="xFacetTopRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3F4F6" />
      <stop offset="60%" stop-color="#D1D5DB" />
      <stop offset="100%" stop-color="#6B7280" />
    </linearGradient>

    <linearGradient id="xFacetBottomLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9CA3AF" />
      <stop offset="70%" stop-color="#6B7280" />
      <stop offset="100%" stop-color="#4B5563" />
    </linearGradient>

    <linearGradient id="xFacetBottomRight" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E5E7EB" />
      <stop offset="60%" stop-color="#9CA3AF" />
      <stop offset="100%" stop-color="#4B5563" />
    </linearGradient>

    <!-- Radial highlight on center of X -->
    <radialGradient id="xCenterGleam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="softBevel" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0.5" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Left Circular Emblem (cx=65, cy=60) -->
  <g id="nexe-emblem" transform="translate(65, 60)" filter="url(#softBevel)">
    <!-- Inner Deep Navy Disc -->
    <circle cx="0" cy="0" r="37.5" fill="#002B49" />

    <!-- Outer Chrome Ring Base -->
    <circle cx="0" cy="0" r="43.5" fill="none" stroke="url(#chromeRing)" stroke-width="8" />

    <!-- Ring Bevel Highlights: Inner and Outer Fine Lines -->
    <circle cx="0" cy="0" r="47.5" fill="none" stroke="#6B7280" stroke-width="0.7" opacity="0.4" />
    <circle cx="0" cy="0" r="39.5" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.7" />

    <!-- 3D Faceted Diagonal Spear Piercing Through -->
    <!-- Upper Facet (facing top-left, highlighted) -->
    <polygon points="-58,58 -2,-2 58,-58 -1,-3" fill="url(#spearUpper)" />
    <!-- Lower Facet (facing bottom-right, shaded) -->
    <polygon points="-58,58 58,-58 2,2" fill="url(#spearLower)" />
    <!-- Sharp Ridge Highlight -->
    <line x1="-58" y1="58" x2="58" y2="-58" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Typography: Deep NEXE Navy #002B49 -->
  <!-- Letter N -->
  <path d="M 136 63 L 136 24 L 148 24 L 163 47 L 163 24 L 173 24 L 173 63 L 161 63 L 146 40 L 146 63 Z" fill="#002B49" />

  <!-- Letter E (First) -->
  <path d="M 183 24 L 213 24 L 213 32 L 193 32 L 193 39 L 209 39 L 209 47 L 193 47 L 193 55 L 213 55 L 213 63 L 183 63 Z" fill="#002B49" />

  <!-- 3D Beveled Metallic Letter X -->
  <g id="metallic-X" transform="translate(220, 24)">
    <!-- Base Bevel Facets for the X (width: 38, height: 39, center: 19, 19.5) -->
    <!-- Top-Left Arm Facet -->
    <polygon points="0,0 12,0 19,19.5 7,19.5" fill="url(#xFacetTopLeft)" />
    <!-- Top-Right Arm Facet -->
    <polygon points="26,0 38,0 31,19.5 19,19.5" fill="url(#xFacetTopRight)" />
    <!-- Bottom-Left Arm Facet -->
    <polygon points="0,39 12,39 19,19.5 7,19.5" fill="url(#xFacetBottomLeft)" />
    <!-- Bottom-Right Arm Facet -->
    <polygon points="26,39 38,39 31,19.5 19,19.5" fill="url(#xFacetBottomRight)" />

    <!-- Center Faceted Bevel Creases (giving that diamond 3D reflection) -->
    <polygon points="6,0 19,19.5 32,0 19,10" fill="#FFFFFF" opacity="0.6" />
    <polygon points="6,39 19,19.5 32,39 19,29" fill="#4B5563" opacity="0.4" />
    <polygon points="0,0 19,19.5 0,39 10,19.5" fill="#E5E7EB" opacity="0.5" />
    <polygon points="38,0 19,19.5 38,39 28,19.5" fill="#9CA3AF" opacity="0.5" />

    <!-- Sharp Bevel Edge Outlines -->
    <line x1="0" y1="0" x2="38" y2="39" stroke="#FFFFFF" stroke-width="0.8" opacity="0.7" />
    <line x1="38" y1="0" x2="0" y2="39" stroke="#4B5563" stroke-width="0.6" opacity="0.6" />

    <!-- Specular Center Lens Gleam -->
    <circle cx="19" cy="19.5" r="10" fill="url(#xCenterGleam)" />
  </g>

  <!-- Letter E (Second) -->
  <path d="M 268 24 L 298 24 L 298 32 L 278 32 L 278 39 L 294 39 L 294 47 L 278 47 L 278 55 L 298 55 L 298 63 L 268 63 Z" fill="#002B49" />

  <!-- Subtitle: RIVNING in Bold Deep Navy #002B49 -->
  <g font-family="'Space Grotesk', 'Arial Black', -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="3.2">
    <text x="136" y="97" fill="#002B49">RIVNING</text>
  </g>
</svg>
